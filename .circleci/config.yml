version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.2.3
jobs:
  build:
    docker:
      - image: cimg/php:8.1-browsers # The primary container where steps are run
        auth:
          username: mydockerhub-user
          password: $DOCKERHUB_PASSWORD # context / project UI env-var reference

      - image: cimg/mysql:8.0
        auth:
          username: mydockerhub-user
          password: $DOCKERHUB_PASSWORD # context / project UI env-var reference
        environment:
          MYSQL_ROOT_PASSWORD: Root_DoitYourself_1D2O3N4A5L6D
          MYSQL_DATABASE: doityourself
          MYSQL_USER: jdonald
          MYSQL_PASSWORD: User_DoitYourself_1D2O3N4A5L6D

    steps:
      - checkout
      - run:
          # Our primary container isn't MYSQL so run a sleep command until it's ready.
          name: Waiting for MySQL to be ready
          command: |
            for i in `seq 1 10`;
            do
              nc -z 127.0.0.1 3306 && echo Success && exit 0
              echo -n .
              sleep 1
            done
            echo Failed waiting for MySQL && exit 1

      # Download and cache dependencies
      - restore_cache:
          keys:
            # "composer.lock" can be used if it is committed to the repo
            - v1-dependencies-{{ checksum "composer.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run:
          name: "Install Dependencies"
          command: composer install -n --prefer-dist

      - save_cache:
          key: v1-dependencies-{{ checksum "composer.json" }}
          paths:
            - ./vendor

      # prepare the database
      - run:
          name: "Create Environment file and generate app key"
          command: |
            mv .env.production .env
            php artisan key:generate

      - run:
          name: "Create database and run migration"
          command: |
            php artisan migrate
            php artisan db:seed --class=TaskSeeder

      - run:
          name: Install MySQL CLI; run an example query
          command: |
            sudo apt-get install default-mysql-client
            mysql --host=127.0.0.1 --user=jdonald --password=User_DoitYourself_1D2O3N4A5L6D doityourself --execute="SELECT * FROM doityourself.tasks"
workflows:
  version: 2
  build-deploy:
    jobs:
      - build
